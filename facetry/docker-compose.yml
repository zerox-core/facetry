# FaceTry 人才招聘工作台 · 一体化部署
# 使用：cp .env.example .env 并填写后，docker compose up -d
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # compose 内的默认连接指向下方服务，.env 中同名变量优先
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-facetry-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-facetry}
      MYSQL_USER: ${MYSQL_USER:-facetry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-facetry-secret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-facetry}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-facetry-secret}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:
