<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投屏 - AI 管培生面试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #101225; color: #eef0fb; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px 48px; }
  #idle { text-align: center; }
  #idle p { font-size: 28px; color: #7d85b3; letter-spacing: 2px; }
  #stage { display: none; width: 100%; }
  /* 单图（D1） */
  .single { text-align: center; }
  .single img { max-width: 62vw; max-height: 78vh; border-radius: 12px; box-shadow: 0 8px 48px rgba(0,0,0,.55); background: #fff; }
  /* 双图并排（D2） */
  .pair { display: flex; gap: 48px; justify-content: center; align-items: flex-start; }
  .pair figure { text-align: center; }
  .pair img { max-width: 42vw; max-height: 68vh; border-radius: 12px; box-shadow: 0 8px 48px rgba(0,0,0,.55); background: #fff; }
  .pair figcaption { margin-top: 14px; font-size: 18px; color: #9aa2c7; font-weight: 600; }
  /* 文本素材（D3） */
  .material {
    max-width: 1100px; font-size: 30px; line-height: 2; color: #ffd9d9;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 36px 44px; white-space: pre-wrap;
  }
</style>
</head>
<body>
<main>
  <div id="idle">
    <p>等待面试官投屏素材…</p>
  </div>
  <div id="stage"></div>
</main>

<script>
// 投屏页只展示素材本体（图片 / 文本块），不展示题干与答案。
// 数据来自服务端脱敏精简后的 /api/screen/state：{questionId, screen:{id,kind,images,material}}
function render(state) {
  const idle = document.getElementById('idle');
  const stage = document.getElementById('stage');
  const s = state.screen;
  if (!s) {
    idle.style.display = 'block';
    stage.style.display = 'none';
    stage.innerHTML = '';
    return;
  }
  idle.style.display = 'none';
  stage.style.display = 'block';
  let html = '';
  if (s.kind === 'image') {
    html = '<div class="single"><img src="' + s.images[0] + '"></div>';
  } else if (s.kind === 'images') {
    const labels = ['方案 A', '方案 B'];
    html = '<div class="pair">' + s.images.map((src, i) =>
      '<figure><img src="' + src + '"><figcaption>' + (labels[i] || '方案 ' + (i + 1)) + '</figcaption></figure>'
    ).join('') + '</div>';
  } else if (s.kind === 'material') {
    html = '<div class="material">' + esc(s.material) + '</div>';
  }
  stage.innerHTML = html;
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 初始拉取一次，再走 SSE（断线由 EventSource 原生重连）
fetch('/api/screen/state').then(r => r.json()).then(render).catch(() => {});
const es = new EventSource('/api/screen/stream');
es.onmessage = e => {
  try {
    const state = JSON.parse(e.data);
    // 流内只推 questionId，重新拉取脱敏展示数据
    fetch('/api/screen/state').then(r => r.json()).then(render).catch(() => {});
  } catch (err) {}
};
</script>
</body>
</html>
